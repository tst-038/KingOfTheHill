name: KingOfTheHill
version: '${version}'
main: io.github.tst_038.koth.plugin.KothPlugin
description: King of the Hill in a world of its own, with a points shop
authors: [tst-038]
api-version: '26.3'
dependencies:
  server:
    # Provides the api and core classes, stats, saved items and players.
    MiniGami:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional; offers %koth_...% placeholders.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  koth.admin:
    description: Reload KOTH, start and stop it, and give and take points
    default: op
  koth.play:
    description: Open the KOTH shop, see your points and go to the KOTH world
    default: true
