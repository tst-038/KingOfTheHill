name: KingOfTheHill
version: '${version}'
main: io.github.tst_038.koth.plugin.KothPlugin
description: King of the Hill in a world of its own, with a points shop
authors: [tst-038]
api-version: '26.3'
dependencies:
  server:
    # Provides the api and core classes, stats, saved items, players and bans.
    MiniGami:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional; offers %koth_...% placeholders.
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  koth.admin:
    description: Reload KOTH, start and stop it, send players out of its world, give and take points, set it up and edit the shop
    default: op
  koth.play:
    description: Hear when KOTH starts and ends, open the KOTH shop, see your points, and go to and leave the KOTH world
    default: true
