prefix: "<gray>「<gold>KOTH</gold>」 "
announce:
  # <join>...</join> makes the text a link that sends whoever clicks it to the KOTH world, without asking them to confirm a command
  # %time%: how long until it starts, %start%: when
  warning: "%prefix%<yellow>King of the Hill starts in <white>%time%</white>. <join><gold>[Go there]</gold></join>"
  # %end%: when it ends
  started: "%prefix%<green>King of the Hill is on until <white>%end%</white>! <join><gold>[Go there]</gold></join>"
  # %reason%: why, from restriction.*; %end%: when the window ends
  waiting: "%prefix%<yellow>King of the Hill is waiting: %reason%. It starts as soon as that changes, and runs until <white>%end%</white> at most."
  ended: "%prefix%<gray>King of the Hill is over."
  # %player%
  captured: "%prefix%<gold>%player%</gold> <yellow>took the hill!"
  dropped: "%prefix%<gray>%player% left, so the hill is free."
# Action bar in the KOTH world every second while KOTH runs; which one depends on the hill
bar:
  free: "<gray>The hill is up for grabs"
  # %player%: who holds it
  holding: "<gold>%player%</gold> <gray>holds the hill"
  # %player% stands on it alone, %seconds% of %needed%
  capturing: "<gold>%player%</gold> <gray>is taking the hill <dark_gray>(<white>%seconds%/%needed%s</white>)"
  contested: "<red>The hill is contested!"
restriction:
  min-online: "only %online% of the %needed% players needed are online"
placeholder:
  no-holder: "<gray>nobody"
  # %held_for% while nobody holds the hill
  not-held: "<gray>-"
  # %balance% in the sidebar before the player's points are read
  balance-loading: "<gray>…"
  never: "<gray>not planned"
status:
  active: "%prefix%<green>Running. <white>Holder: <gold>%holder%</gold>, <white>%time_left%</white> left."
  # %reason%: why, from restriction.*
  waiting: "%prefix%<yellow>Waiting to start: %reason%. <white>%time_left%</white> left of this window."
  inactive: "%prefix%<gray>Not running. Next: <white>%next_start%</white> (in %next_in%)."
  not-configured: "%prefix%<red>KOTH isn't set up; staff can see why in the log."
balance:
  # %points%
  own: "%prefix%<gray>You have <gold>%points%</gold> points."
  loading: "%prefix%<gray>Loading your points, try again."
join:
  in-match: "%prefix%<red>Leave your match first."
  done: "%prefix%<gray>Off you go."
  # Clicking the link in an announcement without koth.play
  no-permission: "%prefix%<red>You may not play King of the Hill."
# /koth leave
leave:
  done: "%prefix%<gray>You left the KOTH world."
  not-there: "%prefix%<red>You're not in the KOTH world."
# /kotha kick <players>. %player%
kick:
  # To the player sent out
  kicked: "%prefix%<red>Staff sent you out of the KOTH world."
  done: "%prefix%<green>Sent <white>%player%</white> out of the KOTH world."
  not-there: "%prefix%<red>%player% is not in the KOTH world."
  none: "%prefix%<red>No online player matched."
  # %count%: players sent out, %total%: players named
  several: "%prefix%<green>Sent <white>%count%</white> of %total% players out of the KOTH world."
# Bans from KOTH, made with MiniGami's /mga ban <players> koth (or all). %left%: "for 2h 5m" or "for good", %reason%
ban:
  # Trying to join, or coming into the KOTH world
  banned: "%prefix%<red>You're banned from King of the Hill %left%<red>: <white>%reason%"
  # Sent out of the KOTH world when the ban is made; MiniGami tells them the ban itself
  sent-out: "%prefix%<red>You were sent out of the KOTH world."
  # %time%: like 2h 5m
  left: "<gray>for <white>%time%</white>"
  forever: "<gray>for good"
  no-reason: "<gray>no reason given"
shop:
  cost-line: "<gray>Cost: <gold>%cost%</gold> points"
  owned-line: "<green>You have this already"
  # The head in the middle of the shop's bar. %points%
  balance: "<gold>Your balance: %points% points"
  balance-loading: "<gray>Your balance: loading…"
  # %entry%: its icon name, %cost%
  bought: "%prefix%<green>You bought %entry% for <gold>%cost%</gold> points."
  # %points%: their balance
  too-poor: "%prefix%<red>That costs <gold>%cost%</gold>; you have <gold>%points%</gold> points."
  owned: "%prefix%<red>You have that already."
  in-match: "%prefix%<red>You can't shop while in a match."
  busy: "%prefix%<gray>Still buying your last pick…"
  unavailable: "%prefix%<red>The shop isn't set up; staff can see why in the log."
  failed: "%prefix%<red>Something went wrong; you kept your points."
  partly-failed: "%prefix%<red>Part of it couldn't be given; staff can see it in the log."
# The arrows of a paged menu. %page%: the page they go to, %pages%: how many there are
menu:
  previous: "<yellow>« Page %page% of %pages%"
  next: "<yellow>Page %page% of %pages% »"
admin:
  reload-done: "%prefix%<green>Reloaded."
  # %problem%
  reload-problem: "%prefix%<red>%problem%"
  reload-kept: "%prefix%<yellow>%file% has problems, so the previous one stays in use."
  reload-unusable: "%prefix%<yellow>%file% has problems, so it isn't used."
  started: "%prefix%<green>Started KOTH."
  stopped: "%prefix%<green>Stopped KOTH."
  already-running: "%prefix%<red>KOTH is already running."
  not-running: "%prefix%<red>KOTH isn't running."
  # %player%, %amount%, %points%: their balance now
  points-given: "%prefix%<green>Gave <white>%player%</white> %amount% points; they have <gold>%points%</gold>."
  points-taken: "%prefix%<green>Took %amount% points from <white>%player%</white>; they have <gold>%points%</gold>."
  points-shown: "%prefix%<white>%player%</white> <gray>has <gold>%points%</gold> points."
  unknown-player: "%prefix%<red>No player called <white>%player%</white> has been here."
  state-running: "<green>running"
  state-idle: "<gray>idle"
  state-waiting: "<yellow>waiting"
  loaded: "<green>ok"
  not-loaded: "<red>not loaded"
  storage-failed: "%prefix%<red>The points storage failed; see the log."
  # The status lines: %state%, %holder%, %taker%, %progress%, %capture%, %next_start%, %online%, %config%, %shop%
  status: "%prefix%<gray>%state% <dark_gray>|</dark_gray> holder %holder% <dark_gray>|</dark_gray> taking: %taker% %progress%/%capture%s <dark_gray>|</dark_gray> next %next_start% <dark_gray>|</dark_gray> online %online% <dark_gray>|</dark_gray> config %config%, shop %shop%"
# /kotha setup. %box% is one of point and colours below.
setup:
  point: "the hill"
  colours: "the colour box"
  no-worldedit: "%prefix%<red>That needs WorldEdit or FastAsyncWorldEdit."
  no-selection: "%prefix%<red>Select the box with WorldEdit first."
  # %world%: the KOTH world
  wrong-world: "%prefix%<red>Do that in the KOTH world, <white>%world%</white>."
  not-loaded: "%prefix%<red>config.yml isn't in use, so there is nothing to select or show; see /kotha reload."
  default-colours: "%prefix%<gray>config.yml sets no colour box, so it is the hill and the layer under it."
  box-set: "%prefix%<green>Saved %box% in config.yml."
  box-selected: "%prefix%<green>Selected %box% with WorldEdit."
  # %seconds%
  box-showing: "%prefix%<gray>Showing %box% for %seconds% seconds."
  spawn-set: "%prefix%<green>Saved the spawn where you stand in config.yml."
  leave-set: "%prefix%<green>Saved where you stand as where players are sent out to, in config.yml."
# Changing a file by command: /kotha config, /kotha shop config, /kotha messages and the setup and shop commands. %file%
edit:
  invalid: "%prefix%<red>Not saved: <white>%file%</white> would have these problems:"
  # %problem%
  problem: "<red> - %problem%"
  save-failed: "%prefix%<red>Could not save <white>%file%</white>; see the log."
  here-needs-player: "%prefix%<red>Only a player can use <white>here</white> as a value."
  # %value%: what was typed
  bad-value: "%prefix%<red><white>%value%</white> isn't a value; put text in quotes, e.g. <white>\"%value%\"</white>."
  # %key%
  set: "%prefix%<green>Set <white>%key%</white> in <white>%file%</white>."
  unset: "%prefix%<green>Took <white>%key%</white> out of <white>%file%</white>; its default applies again."
  # /kotha messages: %key% is the message's key, such as join.done or prefix
  message-unknown: "%prefix%<red>There is no message <white>%key%</white>."
  message-set: "%prefix%<green>Changed message <white>%key%</white> in <white>%file%</white>."
  message-unset: "%prefix%<green>Message <white>%key%</white> is back to the default."
  message-default: "%prefix%<gray>Message <white>%key%</white> already is the default."
  # %text%: the message as written; <set>...</set> puts the command to change it in the chat
  message-text: "<set><hover:show_text:'Click to change'><gold>%key%</gold><gray>: <white>%text%</white></hover></set>"
  # %preview%: the message as players see it, its placeholders left unfilled
  message-preview: "<gray> Shown as: </gray>%preview%"
# /kotha config info and /kotha shop config info: the file, then a line per value. <set>...</set> puts the command to change it in the chat
info:
  config: "%prefix%<gold>%file%</gold><gray>:"
  # %key%, %value%
  value: "<set><hover:show_text:'Click to change'><gray> - <white>%key%</white>: <yellow>%value%</yellow></hover></set>"
  # A value the file leaves out, so its default applies
  value-inherited: "<set><hover:show_text:'Click to change'><dark_gray> - %key%: %value%</hover></set>"
# /kotha shop. %id%: the entry, %saved%: the name its item is saved under in MiniGami
shop-edit:
  bad-id: "%prefix%<red>An id is lower-case letters, digits, _ and -."
  no-item: "%prefix%<red>Hold the item for the entry."
  exists: "%prefix%<red>The shop has an entry <white>%id%</white> already."
  unknown: "%prefix%<red>The shop has no entry <white>%id%</white>."
  slot-taken: "%prefix%<red>That slot is <white>%id%</white>'s."
  # %cost%
  added: "%prefix%<green>Added <white>%id%</white> for <gold>%cost%</gold> points, its item saved as <white>%saved%</white>."
  item-not-written: "%prefix%<red>Could not write the saved item <white>%saved%</white>; it is lost on a restart. See the log."
  cost-set: "%prefix%<green><white>%id%</white> now costs <gold>%cost%</gold> points."
  # %page%, %slot%
  slot-set: "%prefix%<green>Moved <white>%id%</white> to page %page%, slot %slot%."
  # %other%: the other entry
  swapped: "%prefix%<green><white>%id%</white> and <white>%other%</white> swapped places."
  removed: "%prefix%<green>Removed <white>%id%</white>. Its item stays saved as <white>%saved%</white>; /mga loot delete %saved% deletes it."
  list-header: "%prefix%<gray>Shop entries:"
  # %page%, %slot%: where it shows, %cost%, %entry%: its name
  list-entry: "<dark_gray>-</dark_gray> <white>%id%</white> <gray>page %page% slot %slot%, <gold>%cost%</gold> points:</gray> %entry%"
  list-empty: "%prefix%<gray>The shop in use has no entries."
  not-loaded: "%prefix%<red>shop.yml isn't in use, so there is nothing to edit; fix it and run /kotha reload."
  # The shop editor, /kotha shop. Its entries get these lines under their own.
  menu-title: "<dark_gray>Shop editor"
  menu-move: "<yellow>Left click</yellow> <gray>to pick up and move"
  # %step%: how much the cost changes
  menu-cost: "<yellow>Shift-left/right</yellow> <gray>cost + / - %step%"
  menu-remove: "<yellow>Right click</yellow> <gray>to remove"
  menu-picked: "<green>Picked up: click a slot or entry to put it there"
  menu-confirm-remove: "<red>Right click again to remove it"
  menu-id: "<dark_gray>id: %id%"
  menu-help: "<gold>Shop editor"
  # %cost%: what a new entry costs
  menu-help-add: "<gray>Click an empty slot to sell the item in your hand for %cost% points"
  menu-help-move: "<gray>Hover over an entry to see how to change it"
