# KingOfTheHill. Reload with /kotha reload; a file with problems isn't used, and the problems are listed.
world:
  # An existing world folder; it is loaded if it isn't already. A missing folder is a problem: nothing is generated.
  name: koth
  # Where /koth join puts players. Left out: the world's spawn.
  spawn: { x: 0.5, y: 80, z: 0.5, yaw: 0, pitch: 0 }
  # Players who die here come back at that spawn, unless their bed or anchor is in this world.
  respawn-here: true

schedule:
  # cron: KOTH starts at each time below and runs length-minutes, or as long as its line says.
  # cycle: active-minutes on, break-minutes off, around the clock, counted from midnight (server time).
  type: cron
  # Cron lines in server time: minute hour day-of-month month day-of-week (0 or 7 is Sunday).
  # A line is text, which lasts length-minutes, or { start: "<line>", end: "<line>" }: a window starts at each time
  # of the start line and ends at the first time of the end line after it, at most 7 days later, e.g.
  #   - { start: "0 20 * * 1-4", end: "0 21 * * 1-4" }   # Monday to Thursday 20:00-21:00
  #   - { start: "0 20 * * 5", end: "0 22 * * 5" }       # Friday 20:00-22:00
  # A window past midnight needs the end line's own weekday: start "0 23 * * 1", end "0 1 * * 2".
  when:
    - "0 20 * * 1"    # Mondays 20:00
    - "0 20 * * 3"    # Wednesdays 20:00
    - "0 18 * * 6"    # Saturdays 18:00
  # How long a window lasts when its line has no end; also what a forced start runs by default.
  length-minutes: 60
  # type: cycle
  # active-minutes: 15
  # break-minutes: 5
  # Chat warnings this many minutes before a start; one that falls while KOTH runs is left out.
  warn-minutes: [60, 15, 2]

point:
  # The hill: who stands on it alone for capture-seconds takes it, and keeps it until someone else does.
  region: { from: { x: -2, y: 64, z: -2 }, to: { x: 2, y: 66, z: 2 } }
  capture-seconds: 5
  # The wool, carpet, stained glass (and panes), concrete (and powder) and terracotta in this box turn a random colour
  # on each capture, and neutral-colour while KOTH isn't running. Stained glass over a beacon colours its beam.
  # The box is looked at when a round starts; blocks placed during a round don't change colour until the next one.
  # Optional, at most 1048576 blocks; left out, it is the hill and the layer of blocks right under it.
  colour-blocks: { from: { x: -2, y: 60, z: -2 }, to: { x: 2, y: 63, z: 2 } }
  neutral-colour: white

scoring:
  # The holder earns this many points every every-seconds, wherever they are in the world, until someone else takes the hill or KOTH ends.
  # A holder who leaves the world or the server drops the hill.
  points: 1
  every-seconds: 1

restrictions:
  # A window waits, with an announcement, while fewer players than this are online. KOTH starts as soon as there are
  # enough, and runs until the window's end; a window that ends before that is skipped.
  # A forced start (/kotha start) ignores it.
  min-online: 3

# The sidebar of players in the KOTH world. %holder%, %held_for% (how long the holder has held the hill), %time_left%,
# %next_start%, %next_in%, %balance% (the viewer's own points) and %prefix% work here,
# and in waiting also %online% and %needed% (%time_left% is then the time left of the window). At most 15 lines each.
sidebar:
  title: "<gold><bold>King of the Hill"
  inactive:
    - "<gray>Not running"
    - ""
    - "<white>Next: <yellow>%next_start%"
    - "<gray>in %next_in%"
  waiting:
    - "<yellow>Waiting for players"
    - "<white>%online%/%needed% online"
    - ""
    - "<gray>Window ends in %time_left%"
  active:
    - "<white>Holder: <gold>%holder%"
    - "<white>Held for: <yellow>%held_for%"
    - "<white>Time left: <yellow>%time_left%"
    - ""
    - "<white>Your points: <gold>%balance%"
