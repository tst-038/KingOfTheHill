[versions]
# The MiniGami this plugin is built against; its api, core and plugin jar.
minigami = "1.6.0"
paper = "26.3.build.224-stable"
junit = "6.1.3"
run-paper = "3.1.0"
# Optional at runtime: KOTH placeholders.
placeholderapi = "2.12.3"
# The driver Paper 26.3 ships in its server libraries; only for tests, the server provides it at runtime.
sqlite-jdbc = "3.49.1.0"

[libraries]
minigami-api = { module = "io.github.tst-038:minigami-api", version.ref = "minigami" }
minigami-plugin = { module = "io.github.tst-038:minigami-plugin", version.ref = "minigami" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
